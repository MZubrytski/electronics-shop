name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://shop:shop@localhost:5432/shop?schema=public
      DATABASE_URL_TEST: postgresql://shop:shop@localhost:5432/shop_test?schema=public
      # Throwaway values: the suite only needs them to be present and stable.
      JWT_ACCESS_SECRET: ci-access-secret-not-used-anywhere-else
      JWT_REFRESH_SECRET: ci-refresh-secret-not-used-anywhere-else

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build -w @shop/contracts

      - run: npm run format:check
      - run: npm run lint
      - run: npm run test
      - run: npm run test:e2e
